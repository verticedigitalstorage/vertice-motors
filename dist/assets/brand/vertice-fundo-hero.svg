<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a14"/>
      <stop offset="1" stop-color="#07101c"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="38%" r="30%">
      <stop offset="0" stop-color="#2377ff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#2377ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white"/>
      <stop offset=".86" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="grid-fade"><rect width="1920" height="1080" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#grid)" mask="url(#grid-fade)"/>
  <circle cx="1495" cy="500" r="300" fill="none" stroke="#5aa8ff" stroke-opacity=".16"/>
  <ellipse cx="1495" cy="500" rx="350" ry="188" fill="none" stroke="#5aa8ff" stroke-opacity=".16" transform="rotate(-25 1495 500)"/>
</svg>
